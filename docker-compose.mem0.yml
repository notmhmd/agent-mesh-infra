# Optional: Mem0 OSS API — merge with base compose
#   docker compose -f docker-compose.yml -f docker-compose.mem0.yml --profile memory up -d
#
# Requires OPENAI_API_KEY for Mem0 embeddings/LLM (separate from Gemini on strategist).
# Hub image mem0/mem0-api-server is arm64-only; we build from upstream for linux/amd64 (deploy/mem0/Dockerfile).
# Upstream server expects Postgres (pgvector) + Neo4j — see mem0 server/docker-compose.yaml.
# See: https://docs.mem0.ai/open-source/features/rest-api

services:
  neo4j:
    profiles: [memory]
    image: neo4j:5.26.4
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/mem0graph
    networks: [mesh]
    volumes:
      - mem0_neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p mem0graph 'RETURN 1' || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 50s

  mem0:
    profiles: [memory]
    build:
      context: ./deploy/mem0
      dockerfile: Dockerfile
    image: agent-mesh-mem0:local
    restart: unless-stopped
    ports:
      - "8888:8000"
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ADMIN_API_KEY: ${MEM0_API_KEY:-}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-agent_mesh}
      POSTGRES_USER: ${POSTGRES_USER:-agent}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      POSTGRES_COLLECTION_NAME: ${MEM0_POSTGRES_COLLECTION_NAME:-memories}
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USERNAME: neo4j
      NEO4J_PASSWORD: mem0graph
    networks: [mesh]
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy

volumes:
  mem0_neo4j_data:
