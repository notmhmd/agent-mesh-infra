# Deploy agent-mesh to a VPS over SSH (git pull sibling repos + docker compose).
#
# Secrets: VPS_HOST, VPS_USER, VPS_SSH_PRIVATE_KEY
# Optional: VPS_DEPLOY_PATH, VPS_GIT_BRANCH
#
# CD: after "CI" succeeds on a push to main, this workflow runs (workflow_run).
# Remote commands live in scripts/github_vps_deploy.sh (avoids appleboy line-splitting bugs).

name: VPS deploy

on:
  workflow_dispatch:
    inputs:
      run_migrate:
        description: Run Postgres migrations (one-shot migrate container)
        required: false
        default: false
        type: boolean
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

concurrency:
  group: vps-deploy
  cancel-in-progress: true

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: SSH — deploy script on VPS
        uses: appleboy/ssh-action@v1.2.0
        env:
          DEPLOY_PATH: ${{ secrets.VPS_DEPLOY_PATH }}
          GIT_BRANCH: ${{ secrets.VPS_GIT_BRANCH }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          RUN_MIGRATE: ${{ inputs.run_migrate }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          script_stop: true
          envs: DEPLOY_PATH,GIT_BRANCH,GITHUB_EVENT_NAME,RUN_MIGRATE
          script_path: scripts/github_vps_deploy.sh
