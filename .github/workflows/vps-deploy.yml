# Deploy agent-mesh to a VPS over SSH (git pull sibling repos + docker compose).
#
# Secrets: VPS_HOST, VPS_USER, VPS_SSH_PRIVATE_KEY
# Optional: VPS_DEPLOY_PATH
#
# CD: after "CI" succeeds on a push to main, this workflow runs (workflow_run).
# Remote commands: scripts/github_vps_deploy.sh (piped over OpenSSH; avoids appleboy/drone-ssh quirks).

name: VPS deploy

on:
  workflow_dispatch:
    inputs:
      run_migrate:
        description: Run Postgres migrations (one-shot migrate container)
        required: false
        default: false
        type: boolean
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

concurrency:
  group: vps-deploy
  cancel-in-progress: true

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Deploy over SSH (stdin script)
        env:
          SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          DEPLOY_PATH: ${{ secrets.VPS_DEPLOY_PATH }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          RUN_MIGRATE: ${{ github.event_name == 'workflow_dispatch' && inputs.run_migrate == true && 'true' || 'false' }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/agent_mesh_deploy
          chmod 600 ~/.ssh/agent_mesh_deploy
          D="${DEPLOY_PATH:-/opt/agent-mesh/agent-mesh-infra}"
          E="${GITHUB_EVENT_NAME}"
          M="${RUN_MIGRATE:-false}"
          REMOTE="export DEPLOY_PATH=$(printf '%q' "$D"); export GITHUB_EVENT_NAME=$(printf '%q' "$E"); export RUN_MIGRATE=$(printf '%q' "$M"); bash -s"
          ssh -i ~/.ssh/agent_mesh_deploy \
            -o StrictHostKeyChecking=accept-new \
            -o ServerAliveInterval=30 \
            -o ConnectTimeout=120 \
            "${VPS_USER}@${VPS_HOST}" \
            "$REMOTE" \
            < "${GITHUB_WORKSPACE}/scripts/github_vps_deploy.sh"
          rm -f ~/.ssh/agent_mesh_deploy
