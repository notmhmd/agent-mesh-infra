# Deploy agent-mesh to a VPS over SSH (git pull sibling repos + docker compose).
#
# Secrets: VPS_HOST, VPS_USER, VPS_SSH_PRIVATE_KEY
# Optional: VPS_DEPLOY_PATH, VPS_GIT_BRANCH
#
# CD: after "CI" succeeds on a push to main, this workflow runs (workflow_run).
# Remote commands live in scripts/github_vps_deploy.sh (avoids appleboy line-splitting bugs).

name: VPS deploy

on:
  workflow_dispatch:
    inputs:
      run_migrate:
        description: Run Postgres migrations (one-shot migrate container)
        required: false
        default: false
        type: boolean
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

concurrency:
  group: vps-deploy
  cancel-in-progress: true

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main') }}
    runs-on: ubuntu-latest
    steps:
      # workflow_run defaults GITHUB_SHA to default-branch tip; use the CI run commit for script_path + deploy parity.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: SSH — deploy script on VPS
        uses: appleboy/ssh-action@v1.2.0
        env:
          DEPLOY_PATH: ${{ secrets.VPS_DEPLOY_PATH }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          # Avoid empty env values in drone-ssh envs (null inputs break some versions).
          RUN_MIGRATE: ${{ github.event_name == 'workflow_dispatch' && inputs.run_migrate || false }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          # Default 30s dial often flakes from GitHub runners; server also tuned in sshd_config.d/99-agent-mesh-ci.conf
          timeout: 2m
          command_timeout: 30m
          script_stop: true
          envs: DEPLOY_PATH,GITHUB_EVENT_NAME,RUN_MIGRATE
          script_path: ${{ github.workspace }}/scripts/github_vps_deploy.sh
