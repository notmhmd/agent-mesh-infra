# Deploy agent-mesh to a VPS over SSH (git pull sibling repos + docker compose).
#
# Secrets (repo → Settings → Secrets and variables → Actions):
#   VPS_HOST, VPS_USER, VPS_SSH_PRIVATE_KEY
# Optional:
#   VPS_DEPLOY_PATH  path to this repo on the server (default: /opt/agent-mesh/agent-mesh-infra)
#   VPS_GIT_BRANCH   branch to pull (default: main)
#
# One-time on the server: clone all sibling repos under the same parent directory as agent-mesh-infra
# (see deploy/vps/README.md). Use a deploy key or machine user with read access to private repos.

name: VPS deploy

on:
  workflow_dispatch:
    inputs:
      run_migrate:
        description: Run Postgres migrations (one-shot migrate container)
        required: false
        default: false
        type: boolean
  # Optional CD on main — uncomment when secrets are set and you want automatic deploys:
  # push:
  #   branches: [main]
  #   paths:
  #     - 'docker-compose*.yml'
  #     - 'deploy/**'
  #     - 'postgres/**'
  #     - '.github/workflows/vps-deploy.yml'

concurrency:
  group: vps-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: SSH — git pull siblings + compose up
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          script_stop: true
          script: |
            set -euo pipefail
            D="${{ secrets.VPS_DEPLOY_PATH }}"
            if [ -z "${D:-}" ]; then D=/opt/agent-mesh/agent-mesh-infra; fi
            BRANCH="${{ secrets.VPS_GIT_BRANCH }}"
            if [ -z "${BRANCH:-}" ]; then BRANCH=main; fi
            PARENT="$(dirname "$D")"
            echo "Deploy path: $D  parent: $PARENT  branch: $BRANCH"

            for repo in \
              agent-mesh-infra \
              agent-mesh-execution \
              agent-mesh-strategist \
              agent-mesh-signal \
              agent-mesh-dashboard \
              agent-mesh-pipeline \
              agent-mesh-realtime \
              agent-mesh-mesh-tools \
              agent-mesh-contracts
            do
              R="$PARENT/$repo"
              if [ -d "$R/.git" ]; then
                echo "== git pull: $repo =="
                git -C "$R" fetch origin "$BRANCH" --depth=120 || git -C "$R" fetch origin --depth=120
                git -C "$R" checkout "$BRANCH" || git -C "$R" checkout main
                git -C "$R" pull --ff-only origin "$BRANCH" || git -C "$R" pull --ff-only
              else
                echo "(skip missing clone: $R)"
              fi
            done

            cd "$D"
            FILES="-f docker-compose.yml -f docker-compose.vps.yml -f docker-compose.mesh-tools.yml -f docker-compose.realtime.yml"
            PROFILES="--profile llm --profile signals --profile mesh-tools --profile realtime"

            if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.run_migrate }}" = "true" ]; then
              echo "== migrate =="
              docker compose $FILES --profile migrate run --rm migrate
            fi

            echo "== compose up =="
            docker compose $FILES $PROFILES up -d --build
