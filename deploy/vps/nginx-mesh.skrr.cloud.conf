# Install on the edge nginx host (e.g. quant_nginx) when Caddy listens on alternate host ports only.
#
#   sudo cp nginx-mesh.skrr.cloud.conf /opt/hydra/nginx/conf.d/99-mesh.conf
#   docker network connect agent-mesh-infra_mesh quant_nginx   # once; so nginx can reach caddy:80
#   docker exec quant_certbot certbot certonly --webroot -w /var/www/certbot -d mesh.skrr.cloud ...
#   docker exec quant_nginx nginx -t && docker exec quant_nginx nginx -s reload
#
# Paths assume certbot writes to the same volume nginx uses under /etc/nginx/ssl (live/mesh.skrr.cloud).

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name mesh.skrr.cloud;

    ssl_certificate /etc/nginx/ssl/live/mesh.skrr.cloud/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/live/mesh.skrr.cloud/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location / {
        proxy_pass http://caddy:80;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
        proxy_buffering off;
    }
}
