# Tracked default for Gemini-only VPS setups (see deploy/hermes/README.md).
# Hermes upstream defaults to anthropic/claude-opus-4.6; with only GEMINI_API_KEY that
# model ID is sent to Google generateContent and returns 404 NOT_FOUND.

model:
  provider: "gemini"
  # Native Gemini provider: use API model ids (e.g. gemini-2.5-flash-lite), not LiteLLM-style "gemini/..." —
  # otherwise Google receives models/gemini/gemini-2.5-flash-lite and returns 404.
  default: "gemini-2.5-flash-lite"
