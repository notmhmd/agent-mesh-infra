# Run from this directory: docker compose up -d --build
# Expects sibling clones: ../agent-mesh-execution, ../agent-mesh-dashboard

services:
  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-agent}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      POSTGRES_DB: ${POSTGRES_DB:-agent_mesh}
    volumes:
      - ./pg_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    networks: [mesh]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-agent} -d ${POSTGRES_DB:-agent_mesh}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - ./redis_data:/data
    networks: [mesh]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  execution:
    build:
      context: ../agent-mesh-execution
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "9090:9090"
    environment:
      ConnectionStrings__Redis: redis:6379,abortConnect=false
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=${POSTGRES_DB:-agent_mesh};Username=${POSTGRES_USER:-agent};Password=${POSTGRES_PASSWORD:-change-me}
      METRICS_PORT: "9090"
      APCA_API_KEY_ID: ${APCA_API_KEY_ID:-}
      APCA_API_SECRET_KEY: ${APCA_API_SECRET_KEY:-}
    depends_on:
      redis: { condition: service_healthy }
      postgres: { condition: service_healthy }
    networks: [mesh]

  pipeline:
    build:
      context: ../agent-mesh-pipeline
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      REDIS_HOST: redis
      PUBLISH_INTERVAL_SEC: ${PUBLISH_INTERVAL_SEC:-45}
    depends_on:
      redis: { condition: service_healthy }
    networks: [mesh]

  # LLM strategist (LiteLLM) — analysis only; enable with: docker compose --profile llm up -d
  strategist:
    profiles: [llm]
    build:
      context: ../agent-mesh-strategist
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      REDIS_HOST: redis
      POSTGRES_HOST: postgres
      POSTGRES_USER: ${POSTGRES_USER:-agent}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      POSTGRES_DB: ${POSTGRES_DB:-agent_mesh}
      LLM_MODEL: ${LLM_MODEL:-gpt-4o-mini}
      STRATEGIST_INTERVAL_SEC: ${STRATEGIST_INTERVAL_SEC:-120}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      LITELLM_API_KEY: ${LITELLM_API_KEY:-}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-}
    depends_on:
      redis: { condition: service_healthy }
      postgres: { condition: service_healthy }
    networks: [mesh]

  dashboard:
    build:
      context: ../agent-mesh-dashboard
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      REDIS_HOST: redis
      STREAM_KEY: stream:approved:intents
      POSTGRES_HOST: postgres
      POSTGRES_USER: ${POSTGRES_USER:-agent}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      POSTGRES_DB: ${POSTGRES_DB:-agent_mesh}
    depends_on:
      redis: { condition: service_healthy }
      postgres: { condition: service_healthy }
    networks: [mesh]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [dashboard]
    networks: [mesh]

networks:
  mesh:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
