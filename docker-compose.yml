# Run from this directory: docker compose up -d --build
# Expects sibling clones: ../agent-mesh-execution, ../agent-mesh-dashboard

services:
  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-agent}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      POSTGRES_DB: ${POSTGRES_DB:-agent_mesh}
    volumes:
      - ./pg_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    networks: [mesh]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-agent} -d ${POSTGRES_DB:-agent_mesh}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - ./redis_data:/data
    networks: [mesh]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  execution:
    build:
      context: ../agent-mesh-execution
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "9090:9090"
    environment:
      ConnectionStrings__Redis: redis:6379,abortConnect=false
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=${POSTGRES_DB:-agent_mesh};Username=${POSTGRES_USER:-agent};Password=${POSTGRES_PASSWORD:-change-me}
      METRICS_PORT: "9090"
      APCA_API_KEY_ID: ${APCA_API_KEY_ID:-}
      APCA_API_SECRET_KEY: ${APCA_API_SECRET_KEY:-}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_SDK_DISABLED: ${OTEL_SDK_DISABLED:-false}
    depends_on:
      redis: { condition: service_healthy }
      postgres: { condition: service_healthy }
    networks: [mesh]

  # golang-migrate — run: docker compose --profile migrate run --rm migrate
  migrate:
    profiles: [migrate]
    image: migrate/migrate:v4.18.2
    networks: [mesh]
    volumes:
      - ./postgres/migrations:/migrations:ro
      - ./scripts/migrate_up.sh:/migrate_up.sh:ro
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_USER: ${POSTGRES_USER:-agent}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      POSTGRES_DB: ${POSTGRES_DB:-agent_mesh}
    depends_on:
      postgres: { condition: service_healthy }
    entrypoint: ["/bin/sh", "/migrate_up.sh"]

  # Dev Redis stream publisher — opt-in: docker compose --profile pipeline up -d
  # Do not enable alongside signal-agent (duplicate XADD to stream:approved:intents).
  pipeline:
    profiles: [pipeline]
    build:
      context: ../agent-mesh-pipeline
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      REDIS_HOST: redis
      PUBLISH_INTERVAL_SEC: ${PUBLISH_INTERVAL_SEC:-45}
    depends_on:
      redis: { condition: service_healthy }
    networks: [mesh]

  # AI signal router: market_intelligence + Mem0 + LLM → risk → stream:approved:intents
  # Do not run alongside the dev `pipeline` publisher without disabling one (duplicate XADD).
  signal-agent:
    profiles: [signals]
    build:
      context: ../agent-mesh-signal
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "9093:9093"
    environment:
      REDIS_HOST: redis
      POSTGRES_HOST: postgres
      POSTGRES_USER: ${POSTGRES_USER:-agent}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      POSTGRES_DB: ${POSTGRES_DB:-agent_mesh}
      STREAM_KEY: stream:approved:intents
      LLM_MODEL: ${LLM_MODEL:-gpt-4o-mini}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      LITELLM_API_KEY: ${LITELLM_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-}
      SIGNAL_IDLE_POLL_SEC: ${SIGNAL_IDLE_POLL_SEC:-2}
      MI_NOTIFY_CHANNEL: ${MI_NOTIFY_CHANNEL:-mesh:mi:new}
      ALLOWED_SYMBOLS: ${ALLOWED_SYMBOLS:-SPY}
      DEFAULT_SYMBOL: ${DEFAULT_SYMBOL:-SPY}
      SIGNAL_MIN_CONFIDENCE: ${SIGNAL_MIN_CONFIDENCE:-0.52}
      MEM0_BASE_URL: ${MEM0_BASE_URL:-}
      MEM0_API_KEY: ${MEM0_API_KEY:-}
      MEM0_USER_ID: ${MEM0_USER_ID:-agent-mesh}
      MEM0_AGENT_ID: ${SIGNAL_MEM0_AGENT_ID:-signal-router}
      MEM0_RUN_ID: ${MEM0_RUN_ID:-}
      METRICS_PORT: ${SIGNAL_METRICS_PORT:-9093}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_SDK_DISABLED: ${OTEL_SDK_DISABLED:-false}
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME_SIGNAL:-agent-mesh-signal}
    depends_on:
      redis: { condition: service_healthy }
      postgres: { condition: service_healthy }
    networks: [mesh]

  # Mem0 backfill from execution_events (closed loop learning)
  learning-agent:
    profiles: [learning]
    build:
      context: ../agent-mesh-signal
      dockerfile: Dockerfile
    restart: unless-stopped
    command: ["python", "-m", "signal_agent.learning"]
    environment:
      REDIS_HOST: redis
      POSTGRES_HOST: postgres
      POSTGRES_USER: ${POSTGRES_USER:-agent}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      POSTGRES_DB: ${POSTGRES_DB:-agent_mesh}
      LEARNING_POLL_INTERVAL_SEC: ${LEARNING_POLL_INTERVAL_SEC:-60}
      MEM0_BASE_URL: ${MEM0_BASE_URL:-}
      MEM0_API_KEY: ${MEM0_API_KEY:-}
      MEM0_USER_ID: ${MEM0_USER_ID:-agent-mesh}
      MEM0_AGENT_ID: ${LEARNING_MEM0_AGENT_ID:-learning-agent}
      MEM0_RUN_ID: ${MEM0_RUN_ID:-}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_SDK_DISABLED: ${OTEL_SDK_DISABLED:-false}
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME_LEARNING:-agent-mesh-learning}
    depends_on:
      redis: { condition: service_healthy }
      postgres: { condition: service_healthy }
    networks: [mesh]

  # LLM strategist (LiteLLM) — analysis only; enable with: docker compose --profile llm up -d
  strategist:
    profiles: [llm]
    build:
      context: ../agent-mesh-strategist
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      REDIS_HOST: redis
      POSTGRES_HOST: postgres
      POSTGRES_USER: ${POSTGRES_USER:-agent}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      POSTGRES_DB: ${POSTGRES_DB:-agent_mesh}
      LLM_MODEL: ${LLM_MODEL:-gpt-4o-mini}
      STRATEGIST_INTERVAL_SEC: ${STRATEGIST_INTERVAL_SEC:-45}
      LITELLM_REQUEST_TIMEOUT_SEC: ${LITELLM_REQUEST_TIMEOUT_SEC:-45}
      MI_NOTIFY_CHANNEL: ${MI_NOTIFY_CHANNEL:-mesh:mi:new}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      LITELLM_API_KEY: ${LITELLM_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-}
      MEM0_BASE_URL: ${MEM0_BASE_URL:-}
      MEM0_API_KEY: ${MEM0_API_KEY:-}
      MEM0_USER_ID: ${MEM0_USER_ID:-agent-mesh}
      MEM0_AGENT_ID: ${MEM0_AGENT_ID:-strategist}
      MEM0_RUN_ID: ${MEM0_RUN_ID:-}
      MEM0_SEARCH_QUERY: ${MEM0_SEARCH_QUERY:-}
      METRICS_PORT: ${STRATEGIST_METRICS_PORT:-9092}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      OTEL_SDK_DISABLED: ${OTEL_SDK_DISABLED:-false}
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME_STRATEGIST:-agent-mesh-strategist}
    depends_on:
      redis: { condition: service_healthy }
      postgres: { condition: service_healthy }
    networks: [mesh]

  dashboard:
    build:
      context: ../agent-mesh-dashboard
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      REDIS_HOST: redis
      STREAM_KEY: stream:approved:intents
      POSTGRES_HOST: postgres
      POSTGRES_USER: ${POSTGRES_USER:-agent}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      POSTGRES_DB: ${POSTGRES_DB:-agent_mesh}
    depends_on:
      redis: { condition: service_healthy }
      postgres: { condition: service_healthy }
    networks: [mesh]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "${CADDY_HTTP_PORT:-80}:80"
      - "${CADDY_HTTPS_PORT:-443}:443"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [dashboard]
    networks: [mesh]

networks:
  mesh:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
